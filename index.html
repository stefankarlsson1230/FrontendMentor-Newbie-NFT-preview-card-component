<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  
  <title>Frontend Mentor | NFT preview card component</title>
</head>
<body>
  <div id="card">
    <img id="crystal" src="images/image-equilibrium.jpg" alt="a crystal">
  
    <div id="cardContent">
      <h1>Equilibrium #3429</h1>

      <p>Our Equilibrium collection promotes balance and calm.</p>

      <div id="icons">
        <p><img id="smallCrystal" src="images/icon-ethereum.svg" alt=""><span>0.041 ETH </span></p>
        <p><img id="clock" src="images/icon-clock.svg">3 days left</p>
      </div>
      
      <div id="footer">
        <p><img id="photo" src="images/image-avatar.png" alt="photo of Jules">Creation of <span id="name">Jules Wyvern</span></p>
      </div>
    </div>  
  </div>
</body>
</html>
